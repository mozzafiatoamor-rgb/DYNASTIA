<title>DYNASTIA · Coach Gustavo Díaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1318;
  --bg2:#141a22;
  --surface:#1a212b;
  --surface2:#212b37;
  --line:#2b3744;
  --text:#eef2f6;
  --muted:#8a98a8;
  --accent:#1f6dff;
  --accent2:#56a0ff;
  --green:#2fbf71;
  --blue:#3a8dde;
  --amber:#f2a93b;
  --purple:#9b6cff;
  --radius:16px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',sans-serif;
  background:
     radial-gradient(1200px 600px at 50% -10%, #1c2531 0%, transparent 60%),
     var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.bebas{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.02em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.app{max-width:520px;margin:0 auto;padding:0 16px}

/* Header */
.topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg, rgba(15,19,24,.96), rgba(15,19,24,.82));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 14px) 0 14px;
}
.topbar-inner{max-width:520px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;box-shadow:0 6px 16px rgba(31,109,255,.35);
}
.logo svg{width:22px;height:22px;stroke:#fff}
.brand .name{font-size:30px;line-height:.9}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}

/* Views */
.view{padding-top:18px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-title{font-size:34px;line-height:1;margin-bottom:2px}
.view-sub{color:var(--muted);font-size:13px;margin-bottom:18px}

/* Cards */
.card{
  background:linear-gradient(180deg,var(--surface),var(--bg2));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;
}
.card.pad0{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.pill.green{background:rgba(47,191,113,.16);color:#5fe39a}
.pill.amber{background:rgba(242,169,59,.16);color:#ffce7a}
.pill.accent{background:rgba(31,109,255,.16);color:var(--accent2)}
.pill.blue{background:rgba(58,141,222,.16);color:#7db9f0}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface2);border:1px solid var(--line);
  color:var(--text);font-weight:700;font-size:15px;
  padding:13px 16px;border-radius:13px;min-height:50px;width:100%;
  transition:transform .08s, background .15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 8px 20px rgba(31,109,255,.3)}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;padding:9px 13px;font-size:14px;width:auto}
.btn.danger{color:#ff8a7a;border-color:rgba(31,109,255,.3)}
.btn-row{display:flex;gap:10px}
.icon-btn{width:42px;height:42px;min-height:42px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:var(--surface2);border:1px solid var(--line)}
.icon-btn svg{width:19px;height:19px;stroke:var(--text)}

/* Forms */
label.field{display:block;margin-bottom:12px}
label.field .lab{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.input,select.input,textarea.input{
  width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:13px 14px;border-radius:12px;outline:none;
}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:74px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* List items */
.li{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.avatar{width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-family:'Bebas Neue';font-size:22px;color:#fff;background:linear-gradient(135deg,#2b3744,#1a212b);border:1px solid var(--line);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.mini-cal{gap:4px}
.cal-cell.paid{border-color:var(--green);background:rgba(47,191,113,.12)}
.li .meta{flex:1;min-width:0}
.li .meta .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta .dt{font-size:12px;color:var(--muted)}
.chev{stroke:var(--muted);width:18px;height:18px;flex:0 0 auto}

/* Progress bar */
.prog{height:9px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .4s}

/* Stat tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .v{font-family:'Bebas Neue';font-size:38px;line-height:.9}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.stat.accent .v{color:var(--accent2)}
.stat.green .v{color:var(--green)}

.empty{text-align:center;padding:38px 16px;color:var(--muted)}
.empty svg{width:46px;height:46px;stroke:var(--line);margin-bottom:10px}
.section-h{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:22px 4px 10px}

/* Bottom nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(0deg, rgba(15,19,24,.99), rgba(15,19,24,.9));
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
.nav-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted)}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
.nav button span{font-size:10px;font-weight:700;letter-spacing:.02em}
.nav button.active{color:var(--accent2)}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex;animation:fade .2s}
.modal{background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:999px;background:var(--line);margin:10px auto 14px}
.modal h2{font-size:22px;margin-bottom:16px}

/* Timer fullscreen */
.timer-screen{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;color:#fff;transition:background .4s;overflow-y:auto}
.timer-screen.show{display:flex}
.phase-prep{background:linear-gradient(160deg,#1f4e7a,#0f2740);--ring:#56a0ff}
.phase-work{background:linear-gradient(160deg,#1f8a4d,#0c3d22);--ring:#3ddc84}
.phase-rest{background:linear-gradient(160deg,#b5791b,#5c3d0c);--ring:#ffc24d}
.phase-restSeries{background:linear-gradient(160deg,#7d4bc4,#341b56);--ring:#b388ff}
.phase-reps{background:linear-gradient(160deg,#c2541f,#5c220c);--ring:#ff8f5c}
.phase-done{background:linear-gradient(160deg,#c23a26,#5c170f);--ring:#ff6f5e}
.ts-top{padding:calc(env(safe-area-inset-top) + 18px) 22px 0;display:flex;justify-content:space-between;align-items:center}
.ts-x{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center}
.ts-x svg{width:22px;height:22px;stroke:#fff}
.ts-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px}
.ts-label{font-family:'Bebas Neue';font-size:46px;letter-spacing:.04em;text-transform:uppercase;opacity:.95}
.ts-block{font-size:15px;font-weight:700;opacity:.8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em}
.ts-num{font-family:'Bebas Neue';font-size:min(27vw,135px);line-height:.85;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.ts-meta{font-size:16px;font-weight:700;opacity:.85;margin-top:8px;letter-spacing:.05em}
.ts-next{font-size:13px;opacity:.6;margin-top:14px}
.ts-bottom{padding:0 22px calc(env(safe-area-inset-bottom) + 26px);display:flex;gap:12px}
.ts-btn{flex:1;min-height:62px;border-radius:16px;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(4px)}
.ts-btn.main{background:#fff;color:#111}
.ts-btn svg{width:22px;height:22px}
.ts-prog{height:6px;background:rgba(255,255,255,.18);margin:0 22px 16px;border-radius:999px;overflow:hidden}
.ts-prog > i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .3s}
.ts-ring-wrap{position:relative;width:min(78vw,320px);height:min(78vw,320px);display:grid;place-items:center;margin:8px 0 4px}
.ts-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ts-ring-track{fill:none;stroke:rgba(255,255,255,.12)}
.ts-ring-track.outer{stroke-width:2.5}
.ts-ring-track.inner{stroke-width:6}
.ts-ring-prog{fill:none;stroke-dasharray:100;stroke-dashoffset:0;stroke-linecap:round}
.ts-ring-prog.inner{stroke:var(--ring,#fff);stroke-width:6.5;transition:stroke-dashoffset .15s linear, stroke .3s;filter:drop-shadow(0 0 5px rgba(255,255,255,.22))}
.ts-ring-prog.outer{stroke:#c7d2dd;stroke-width:3;transition:stroke-dashoffset .25s linear;opacity:.9}
.ts-bg{position:absolute;inset:0;background-size:90%!important;background-position:center 46%!important;opacity:.16;pointer-events:none;z-index:0}
.timer-screen>.ts-top,.timer-screen>.ts-mid,.timer-screen>.ts-bottom{position:relative;z-index:1}

.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(86px + env(safe-area-inset-bottom));z-index:35;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 24px rgba(31,109,255,.4);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.5}
.hide{display:none!important}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:700;padding:12px 18px;border-radius:12px;z-index:90;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s, transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.block-card{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;background:var(--bg)}
.mini{width:34px;height:34px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:14px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.mini:disabled{opacity:.3}
.drag-handle{cursor:grab;touch-action:none;font-size:16px;color:var(--muted)}
.dragrow{transition:border-color .15s, box-shadow .15s}
.dragrow.dragging{opacity:.75;border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.55)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}
.note-line{padding:11px 0;border-bottom:1px solid var(--line)}
.note-line:last-child{border:none}
.warn{background:rgba(242,169,59,.1);border:1px solid rgba(242,169,59,.3);color:#ffce7a;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.video-bg{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
.video-bg.show{display:flex;animation:fade .2s}
.video-box{width:100%;max-width:680px;position:relative}
.video-x{position:absolute;top:-46px;right:0;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.video-frame{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.ts-video-row{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.ts-video{background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:13px;padding:10px 15px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(4px)}
.ts-video svg{width:15px;height:15px;fill:#fff}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-size:24px}
.cal-nav{width:42px;height:42px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:24px;font-weight:700;line-height:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{margin-bottom:6px}
.cal-dow-c{text-align:center;font-size:11px;color:var(--muted);font-weight:800}
.cal-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text);font-weight:700;padding:0}
.cal-cell.empty{border:none;background:transparent}
.cal-cell.active{background:var(--surface)}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cal-cell span{font-size:14px}
.cal-ic{font-size:9px;line-height:1;height:10px}
.cal-legend{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:11px;color:var(--muted)}

.brand .name{background:linear-gradient(180deg,#eef2f7,#9aa6b2);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---- Migración + catálogo base ---- */
(function migrate(){
  if(!db.attendance) db.attendance=[];
  if(!db.payments) db.payments=[];
  if(!db.plans) db.plans=[];
  if(!db.tabatas) db.tabatas=[];
  if(!db.settings) db.settings={pkgPrice:300,pkgSize:6,particularPrice:150};
  if(db.settings.soundVol==null) db.settings.soundVol=0.9;
  if(!db.settings.sounds) db.settings.sounds={};
  if(db.settings.coachWhatsapp==null) db.settings.coachWhatsapp="529832079693";
  if(db.settings.coachName==null) db.settings.coachName="Gustavo Díaz";
  if(!db.categories) db.categories=[];
  BASE_CATS.forEach(c=>{ if(!db.categories.includes(c)) db.categories.push(c); });
  if(!db.exercises) db.exercises=[];
  if(!db.seededKeys) db.seededKeys=[];
  // programas viejos (blocks) -> items
  (db.programs||[]).forEach(p=>{
    if(p.blocks && !p.items){
      p.items=p.blocks.map(b=>({id:uid(),name:b.label||'Ejercicio',category:'Activación',type:'time',
        prep:b.prep,work:b.work,rest:b.rest,rounds:b.rounds,series:b.series,restSeries:b.restSeries,reps:0,note:''}));
      delete p.blocks;
    }
    if(!p.items) p.items=[];
  });
  // sembrar catálogo base: solo las claves que aún no se han sembrado (respeta lo que crees o borres)
  const D={prep:0,work:0,rest:0,rounds:0,series:0,restSeries:0,reps:0,note:''};
  BASE_EXERCISES.forEach(b=>{
    if(!db.seededKeys.includes(b.key)){
      const {key,...rest}=b;
      db.exercises.push({id:uid(),seedKey:key,...D,...rest});
      db.seededKeys.push(key);
    }
  });
  // separar el link de la nota a su propio campo editable (una sola vez por ejercicio)
  db.exercises.forEach(e=>{
    if(e.video===undefined){
      const u=firstUrl(e.note||'');
      e.video = u || '';
      if(u){ e.note=(e.note||'').replace(/Ver:\s*https?:\/\/\S+/i,'').replace(/\s{2,}/g,' ').replace(/\.\s*\./g,'.').replace(/\s+\./g,'.').trim(); }
    }
  });
  save();
})();

function studentPartPrice(st){ return (st && st.partPrice!=null && st.partPrice!=='') ? +st.partPrice : db.settings.particularPrice; }

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

/* ---- Video (YouTube incrustado) ---- */
function firstUrl(text){ const m=(text||'').match(/https?:\/\/[^\s)]+/); return m? m[0].replace(/[.,;]+$/,'') : null; }
function ytId(url){ if(!url) return null; const m=url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/); return m? m[1] : null; }
function exVideoUrl(ex){ return (ex && ex.video) || firstUrl(ex && ex.note) || ''; }
function cleanNote(n){ if(!n) return ''; return (''+n).replace(/https?:\/\/\S+/g,'').replace(/\bVer:\s*/gi,'').replace(/\s{2,}/g,' ').trim(); }
function isVideoFile(url){ return /\.(mp4|webm|m4v|mov|ogg|ogv)(\?.*)?$/i.test(url||''); }
function jsAttr(s){ return (''+s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function playVideo(url){
  if(!url) return;
  const f=$('#videoFrame'); if(!f) return;
  const id=ytId(url);
  if(id){
    f.innerHTML='<iframe width="100%" height="100%" style="border:0;border-radius:12px" src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  } else if(isVideoFile(url)){
    f.innerHTML='<video src="'+esc(url)+'" controls autoplay playsinline style="width:100%;height:100%;border-radius:12px;background:#000"></video>';
  } else { try{ window.open(url,'_blank','noopener'); }catch(e){} return; }
  $('#videoBg').classList.add('show');
}
function demoBtn(url){
  if(!url) return '';
  const safe=esc(url), embed = ytId(url) || isVideoFile(url);
  if(embed) return `<div class="btn-row" style="margin-top:8px">
      <button class="btn ghost sm" style="flex:1" onclick="playVideo('${jsAttr(url)}')"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M5 4l14 8-14 8z"/></svg>Ver aquí</button>
      <a class="btn ghost sm" style="flex:1;text-decoration:none" href="${safe}" target="_blank" rel="noopener">↗ Abrir en navegador</a>
    </div>`;
  return `<a class="btn ghost sm" style="width:100%;margin-top:8px;text-decoration:none" href="${safe}" target="_blank" rel="noopener">↗ Ver referencia</a>`;
}
function showVideo(id){
  const f=$('#videoFrame'); if(!f) return;
  f.innerHTML='<iframe width="100%" height="100%" style="border:0;border-radius:12px" src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';

}
function closeVideo(){ const f=$('#videoFrame'); if(f) f.innerHTML=''; $('#videoBg').classList.remove('show'); }
function pauseTimerForVideo(){ if(T.running){ T.running=false; T.last=Date.now(); const b=$('#playBtn'); if(b)b.textContent='Reanudar'; releaseWake(); } }
function showVideoFromTimer(){ pauseTimerForVideo(); if(T.curUrl) playVideo(T.curUrl); }
function openVideoExternalFromTimer(){ pauseTimerForVideo(); if(T.curUrl){ try{ window.open(T.curUrl,'_blank','noopener'); }catch(e){} } }
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }

function studentAttendance(id){ return db.attendance.filter(a=>a.studentId===id).sort((a,b)=>b.date.localeCompare(a.date)); }
function viewAlumnos(){
  const s=db.students.slice().sort((a,b)=>a.name.localeCompare(b.name));
  let h=`<section class="view"><h1 class="view-title bebas">Alumnos</h1><div class="view-sub">${s.length} registrado${s.length===1?'':'s'}</div>`;
  if(!s.length){
    h+=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><div>Aún no tienes alumnos.<br>Toca el botón <b>+</b> para agregar el primero.</div></div>`;
  }else{
    h+=`<div class="card pad0">`;
    s.forEach(st=>{
      const used=st.package?.used||0, size=st.package?.size||0;
      const pct=size?Math.min(100,Math.round(used/size*100)):0;
      const tag = size? (used>=size?`<span class="pill amber">Renovar</span>`:`<span class="pill green">${used}/${size}</span>`) : `<span class="pill blue">Particular</span>`;
      h+=`<div class="li" onclick="studentDetail('${st.id}')">
        <div class="avatar">${avatarInner(st)}</div>
        <div class="meta"><div class="nm">${esc(st.name)}</div>
          <div class="dt">${studentAttendance(st.id).length} asistencias</div></div>
        ${tag}
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</section>`;
  main.innerHTML=h;
}

let stuPayCal=null;
function stuPayNav(id,d){ let m=stuPayCal.m+d,y=stuPayCal.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} stuPayCal={sid:id,y,m}; studentDetail(id); }
function renderStudentPayCal(id){
  const y=stuPayCal.y, m=stuPayCal.m, ym=ymd(y,m,1).slice(0,7);
  const first=new Date(y,m,1), startDow=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  const byDay={}; db.payments.filter(p=>p.studentId===id && p.date.slice(0,7)===ym).forEach(p=>{ const dd=+p.date.slice(8,10); byDay[dd]=(byDay[dd]||0)+p.amount; });
  let h=`<div class="cal-head" style="margin-bottom:8px">
    <button class="cal-nav" style="width:34px;height:34px;font-size:18px" onclick="stuPayNav('${id}',-1)">‹</button>
    <div class="bebas" style="font-size:18px">${MONTHS[m]} ${y}</div>
    <button class="cal-nav" style="width:34px;height:34px;font-size:18px" onclick="stuPayNav('${id}',1)">›</button></div>`;
  h+=`<div class="cal-grid mini-cal cal-dow">`+['L','M','X','J','V','S','D'].map(d=>`<div class="cal-dow-c" style="font-size:9px">${d}</div>`).join('')+`</div>`;
  h+=`<div class="cal-grid mini-cal">`;
  for(let i=0;i<startDow;i++) h+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){ const paid=byDay[d]; h+=`<div class="cal-cell${paid?' paid':''}"><span style="font-size:11px">${d}</span><div class="cal-ic">${paid?'💲':''}</div></div>`; }
  h+=`</div>`;
  return h;
}
function studentDetail(id){
  const st=db.students.find(x=>x.id===id); if(!st)return;
  if(!stuPayCal || stuPayCal.sid!==id) stuPayCal={sid:id,y:new Date().getFullYear(),m:new Date().getMonth()};
  const att=studentAttendance(id);
  const used=st.package?.used||0, size=st.package?.size||0;
  const pct=size?Math.min(100,Math.round(used/size*100)):0;
  let h=`<div class="row between" style="margin-bottom:14px">

  });
  openModal(h);
}

let studentPhoto=null;
function compressImage(file, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const sw=Math.min(img.width,img.height);
      const target=Math.min(300, sw);
      const c=document.createElement('canvas'); c.width=target; c.height=target;
      const ctx=c.getContext('2d');
      ctx.drawImage(img,(img.width-sw)/2,(img.height-sw)/2,sw,sw,0,0,target,target);
      try{ cb(c.toDataURL('image/jpeg',0.8)); }catch(err){ toast('No se pudo procesar la foto'); }
    };
    img.onerror=()=>toast('Imagen no válida');
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function onPhotoPick(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  compressImage(f, url=>{ studentPhoto=url; const p=$('#photoPrev'); if(p)p.innerHTML='<img src="'+url+'" alt="">'; const rm=$('#photoRm'); if(rm)rm.classList.remove('hide'); });
}

function saveStudent(id){
  const name=$('#f_name').value.trim(); if(!name){ toast('Escribe un nombre'); return; }
  const pkgP=$('#f_pkgPrice').value.trim(), partP=$('#f_partPrice').value.trim();
  const pkgPrice = pkgP===''? null : (parseFloat(pkgP)||0);
  const partPrice = partP===''? null : (parseFloat(partP)||0);
  if(id){ const st=db.students.find(x=>x.id===id); st.name=name; st.phone=$('#f_phone').value.trim(); st.notes=$('#f_notes').value.trim(); st.photo=studentPhoto||null; st.pkgPrice=pkgPrice; st.partPrice=partPrice; }
  else db.students.push({id:uid(),name,phone:$('#f_phone').value.trim(),notes:$('#f_notes').value.trim(),photo:studentPhoto||null,pkgPrice,partPrice,package:null,createdAt:Date.now()});
  save(); closeModal(); render(); toast('Alumno guardado');
}
function delStudent(id){
  if(!confirm('¿Borrar este alumno y todo su historial?'))return;
  db.students=db.students.filter(x=>x.id!==id);
  db.attendance=db.attendance.filter(a=>a.studentId!==id);
  db.payments=db.payments.filter(p=>p.studentId!==id);
  save(); closeModal(); render(); toast('Alumno eliminado');
}

  const st=db.students.find(x=>x.id===sid);
  const progs=db.programs.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');

function delAttendance(aid,sid){
  const a=db.attendance.find(x=>x.id===aid);
  db.attendance=db.attendance.filter(x=>x.id!==aid);
  const st=db.students.find(x=>x.id===sid);
  if(st && st.package && st.package.used>0) st.package.used--;
  save(); studentDetail(sid); render();
}

=================================================================== */
let progSub='programs';
function progSwitch(s){ progSub=s; render(); }
function fmtDur(s){ s=Math.round(s); const m=Math.floor(s/60), ss=s%60; return m?`${m}m${ss?' '+ss+'s':''}`:`${ss}s`; }
function itemSummary(it){ return it.type==='reps' ? `${it.series} ser \u00d7 ${it.reps} reps` : `${it.work}s ejerc \u00b7 ${it.rounds}r \u00d7 ${it.series}s`; }
function itemTimedSeconds(it){
  if(it.type==='time'){ const rounds=Math.max(1,+it.rounds||1), series=Math.max(1,+it.series||1);
    return (+it.prep||0)+series*rounds*(+it.work||0)+series*(rounds-1)*(+it.rest||0)+(series-1)*(+it.restSeries||0); }
  const series=Math.max(1,+it.series||1); return (series-1)*(+it.restSeries||0);
}
function programTimed(p){ return (p.items||[]).reduce((a,it)=>a+itemTimedSeconds(it),0); }

function viewProgramas(){
  let h=`<section class="view"><h1 class="view-title bebas">Entrenamiento</h1>
    <div class="seg"><button class="${progSub==='programs'?'on':''}" onclick="progSwitch('programs')">Programas</button>
    <button class="${progSub==='exercises'?'on':''}" onclick="progSwitch('exercises')">Ejercicios</button></div>`;
  h+= progSub==='exercises'? renderExercisesList() : renderProgramsList();
  h+=`</section>`;
  main.innerHTML=h;
}
function renderProgramsList(){
  if(!db.programs.length){
    return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><div>Arma programas con tus ejercicios.<br>Toca <b>+</b> para crear uno.</div></div>`;
  }
  let h='';
  db.programs.forEach(p=>{
    h+=`<div class="card" onclick="programDetail('${p.id}')">
      <div class="row between"><b style="font-size:17px">${esc(p.name)}</b><span class="pill accent">~${fmtDur(programTimed(p))}</span></div>
      ${p.description?`<div class="tiny muted" style="margin-top:4px">${esc(p.description)}</div>`:''}
      <div class="tiny muted" style="margin-top:8px">${p.items.length} ejercicio${p.items.length===1?'':'s'} \u00b7 ${p.items.map(it=>esc(it.name)).join(' \u2192 ')||'vac\u00edo'}</div>
    </div>`;
  });
  return h;
}
function renderExercisesList(){
  if(!db.exercises.length){
    return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 5h16M4 12h16M4 19h16"/></svg><div>Registra tus drills, estiramientos<br>y ejercicios. Toca <b>+</b> para empezar.</div></div>`;
  }
  let h='';
  const cats=[...new Set([...db.categories, ...db.exercises.map(e=>e.category)])];
  cats.forEach(cat=>{
    const list=db.exercises.filter(e=>e.category===cat); if(!list.length) return;
    h+=`<div class="section-h">${esc(cat)}</div><div class="card pad0">`;
    list.forEach(e=>{
      h+=`<div class="li" onclick="editExercise('${e.id}')">
        <div class="meta"><div class="nm">${esc(e.name)}</div><div class="dt">${itemSummary(e)}</div></div>
        <span class="pill ${e.type==='reps'?'amber':'blue'}">${e.type==='reps'?'Reps':'Tiempo'}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>`;
    });
    h+=`</div>`;
  });
  return h;
}

function programDetail(id){
  const p=db.programs.find(x=>x.id===id); if(!p)return;

let exEdit=null, exEditId=null, exItemIdx=-1;
function editExercise(id){
  exItemIdx=-1; exEditId=id||null;
  const e=id?db.exercises.find(x=>x.id===id):null;
  exEdit = e? JSON.parse(JSON.stringify(e))
    : {name:'',category:db.categories[0]||'Activación',type:'time',prep:10,work:20,rest:10,rounds:8,series:1,restSeries:60,reps:10,note:'',video:''};
  renderExerciseForm();
}
function editItem(i){ exItemIdx=i; exEditId=null; exEdit=JSON.parse(JSON.stringify(progEdit.items[i])); renderExerciseForm(); }
function exSetType(t){ exEdit.type=t; renderExerciseForm(); }
function renderExerciseForm(){
  const e=exEdit, isItem=exItemIdx>=0;
  const cats=db.categories.map(c=>`<option value="${esc(c)}">`).join('');

   <label class="field"><span class="lab">Nombre</span><input class="input" value="${esc(e.name)}" placeholder="Ej. Soft toss" oninput="exEdit.name=this.value"></label>
   <label class="field"><span class="lab">Categor\u00eda</span><input class="input" list="ex_cats" value="${esc(e.category)}" placeholder="Escribe o elige" oninput="exEdit.category=this.value"><datalist id="ex_cats">${cats}</datalist></label>
   <div class="seg"><button class="${e.type==='time'?'on':''}" onclick="exSetType('time')">Por tiempo</button><button class="${e.type==='reps'?'on':''}" onclick="exSetType('reps')">Por repeticiones</button></div>
   <div id="ex_fields"></div>
   <label class="field" style="margin-top:12px"><span class="lab">Nota / indicaci\u00f3n (opcional)</span><textarea class="input" placeholder="Cue t\u00e9cnico, ej. cargar cadera" oninput="exEdit.note=this.value">${esc(e.note||'')}</textarea></label>
   <label class="field"><span class="lab">Link del video (YouTube u otro)</span><input class="input" value="${esc(e.video||'')}" placeholder="https://youtube.com/watch?v=..." oninput="exEdit.video=this.value" inputmode="url"></label>
   ${demoBtn(exVideoUrl(e))}
   <div class="btn-row"><button class="btn primary" onclick="saveExercise()">Guardar</button>${(exEditId&&!isItem)?`<button class="btn danger" style="flex:0 0 auto" onclick="delExercise()">Borrar</button>`:''}</div>`;
  openModal(h); renderExFields();
}
function renderExFields(){
  const e=exEdit, w=$('#ex_fields'); if(!w)return;
  if(e.type==='time'){
    w.innerHTML=`<div class="grid3">${exNum('prep','Prep (s)',e.prep)}${exNum('work','Ejerc. (s)',e.work)}${exNum('rest','Desc. (s)',e.rest)}</div>
      <div class="grid3" style="margin-top:10px">${exNum('rounds','Rondas',e.rounds)}${exNum('series','Series',e.series)}${exNum('restSeries','D.serie(s)',e.restSeries)}</div>
      <div class="tiny muted" style="margin-top:9px">\u2248 ${fmtDur(itemTimedSeconds(e))} \u00b7 avanza solo con el cron\u00f3metro</div>`;
  } else {
    w.innerHTML=`<div class="grid3">${exNum('series','Series',e.series)}${exNum('reps','Reps x serie',e.reps)}${exNum('restSeries','Desc. serie(s)',e.restSeries)}</div>
      <div class="tiny muted" style="margin-top:9px">En clase tocas \u201cSiguiente\u201d al terminar cada serie. El descanso entre series corre con cron\u00f3metro.</div>`;
  }
}
function exNum(k,lab,v){ return `<label class="field" style="margin:0"><span class="lab" style="font-size:10px">${lab}</span><input class="input" type="number" inputmode="numeric" min="0" value="${v}" style="padding:11px 8px;text-align:center" oninput="exEdit.${k}=parseInt(this.value)||0"></label>`; }
function saveExercise(){
  const e=exEdit; e.name=(e.name||'').trim(); if(!e.name){ toast('Ponle nombre al ejercicio'); return; }
  e.category=(e.category||'').trim()||'General';
  if(!db.categories.includes(e.category)) db.categories.push(e.category);
  if(exItemIdx>=0){ e.id=progEdit.items[exItemIdx].id||uid(); progEdit.items[exItemIdx]=e; closeModal(); renderProgramBuilder(); toast('Ejercicio ajustado'); return; }
  if(exEditId){ Object.assign(db.exercises.find(x=>x.id===exEditId), e); }
  else db.exercises.push({id:uid(),...e});

/* ---- Arrastrar para reordenar (táctil + mouse) ---- */
let dragRow=null;
function dragStart(ev){
  ev.preventDefault();
  const row=ev.currentTarget.closest('.dragrow'); if(!row)return;
  dragRow=row; row.classList.add('dragging');
  try{ ev.currentTarget.setPointerCapture(ev.pointerId); }catch(e){}
  document.addEventListener('pointermove', dragMove);
  document.addEventListener('pointerup', dragEnd, {once:true});
  document.addEventListener('pointercancel', dragEnd, {once:true});
}
function dragMove(ev){
  if(!dragRow)return;
  const cont=$('#prog_items'); if(!cont)return;
  const y=ev.clientY;
  const rows=[...cont.querySelectorAll('.dragrow')].filter(r=>r!==dragRow);
  let before=null;
  for(const r of rows){ const b=r.getBoundingClientRect(); if(y < b.top + b.height/2){ before=r; break; } }
  if(before){ cont.insertBefore(dragRow, before); } else { cont.appendChild(dragRow); }
}
function dragEnd(){
  document.removeEventListener('pointermove', dragMove);
  if(!dragRow)return;
  dragRow.classList.remove('dragging');
  const cont=$('#prog_items');
  const order=[...cont.querySelectorAll('.dragrow')].map(r=>+r.dataset.i);
  progEdit.items = order.map(idx=>progEdit.items[idx]);
  dragRow=null;
  renderProgItems();
}

let T = { phases:[], idx:0, remaining:0, running:false, interval:null, last:0, beep:true, wake:null, lastSec:null, program:null, exNames:[], attCtx:null, curVid:null, curUrl:null };
let _customAudios={};
function soundVol(){ const v=db.settings&&db.settings.soundVol; return (v==null?0.9:v); }
function setVol(v){ v=Math.max(0,Math.min(1.5,+v||0)); db.settings.soundVol=v; save(); if(actx&&actx._master) actx._master.gain.value=v; const l=document.getElementById('volLbl'); if(l)l.textContent=Math.round(v*100)+'%'; }
function playCustom(ev){
  if(!T.beep) return false;
  const src=db.settings&&db.settings.sounds&&db.settings.sounds[ev];
  if(!src) return false;
  try{
    let a=_customAudios[ev];
    if(!a||a._src!==src){ a=new Audio(src); a._src=src; _customAudios[ev]=a; }
    a.pause(); a.currentTime=0; a.volume=Math.max(0,Math.min(1,soundVol()));
    a.play().catch(()=>{});
  }catch(e){ return false; }
  return true;
}
function onSoundPick(ev,inp){
  const f=inp.files&&inp.files[0]; if(!f){ return; }
  if(f.size>600*1024){ toast('Audio muy grande (máx ~600 KB). Usa un clip de 1-2 s.'); inp.value=''; return; }
  if(!db.settings.sounds) db.settings.sounds={};
  const r=new FileReader();
  r.onload=()=>{ try{ db.settings.sounds[ev]=r.result; save(); _customAudios[ev]=null; render(); toast('Audio guardado'); testSound(ev); }catch(e){ toast('No se pudo guardar (¿muy grande?)'); } };
  r.onerror=()=>toast('No se pudo leer el audio');
  r.readAsDataURL(f); inp.value='';
}

    if(ev==='cuenta') countdownBeep(1);
    else if(ev==='inicio') phaseBeep('work');
    else if(ev==='descanso') phaseBeep('rest');
    else if(ev==='final') celebrate();
  }

}

function buildExerciseSteps(ex){
  const st=[]; const vurl=exVideoUrl(ex); const vid=ytId(vurl);
  if(ex.type==='reps'){
    const series=Math.max(1,+ex.series||1), reps=+ex.reps||0, restS=+ex.restSeries||0;
    for(let s=0;s<series;s++){
      st.push({mode:'manual',type:'reps',exName:ex.name,exCat:ex.category,label:ex.name,info:`Serie ${s+1}/${series}`+(reps?` \u00b7 ${reps} reps`:''),reps,vid});
      if(restS>0 && s<series-1) st.push({mode:'auto',type:'rest',exName:ex.name,exCat:ex.category,label:'Descanso',info:`Sigue serie ${s+2}/${series}`,sec:restS,vid});
    }
  } else {
    const prep=+ex.prep||0, work=+ex.work||0, rest=+ex.rest||0, rounds=Math.max(1,+ex.rounds||1), series=Math.max(1,+ex.series||1), restS=+ex.restSeries||0;
    if(prep>0) st.push({mode:'auto',type:'prep',exName:ex.name,exCat:ex.category,label:'Prep\u00e1rate',info:ex.name||'',sec:prep,vid});
    for(let s=0;s<series;s++){
      for(let r=0;r<rounds;r++){
        if(work>0) st.push({mode:'auto',type:'work',exName:ex.name,exCat:ex.category,label:ex.name||'\u00a1Ejercicio!',info:`Serie ${s+1}/${series} \u00b7 Ronda ${r+1}/${rounds}`,sec:work,vid});
        const lr=r===rounds-1, ls=s===series-1;
        if(lr&&ls){}
        else if(lr&&!ls){ if(restS>0) st.push({mode:'auto',type:'restSeries',exName:ex.name,exCat:ex.category,label:'Descanso de serie',info:`Sigue serie ${s+2}/${series}`,sec:restS,vid}); }
        else { if(rest>0) st.push({mode:'auto',type:'rest',exName:ex.name,exCat:ex.category,label:'Descanso',info:`Serie ${s+1}/${series} \u00b7 Ronda ${r+1}/${rounds}`,sec:rest,vid}); }
      }
    }
  }
  st.forEach(function(s){ s.vurl=vurl; });
  return st;
}

  const p=db.programs.find(x=>x.id===id); if(!p||!p.items.length){ toast('Programa sin ejercicios'); return; }
  let steps=[]; p.items.forEach(it=> steps=steps.concat(buildExerciseSteps(it)));
  if(!steps.length){ toast('Agrega tiempos o series a los ejercicios'); return; }
  startSession(steps, p, [...new Set(p.items.map(it=>it.name))]);

function startSession(steps, program, exNames){
  if(!steps.length){ toast('Configura al menos un ejercicio'); return; }
  steps.push({mode:'auto',type:'done',sec:0,label:'\u00a1Terminaste!',exName:'',exCat:''});
  T.phases=steps; T.idx=0; T.remaining=steps[0].sec||0; T.running=true; T.last=Date.now(); T.lastSec=null;
  T.program=program||null; T.exNames=exNames||[];
  T.student=false; T.studentProg=null;
  T.weights=T.phases.map(p=> p.type==='done'?0 : (p.mode==='manual'? 20 : (p.sec||0)));
  T.cum=[]; let _acc=0; T.phases.forEach((p,i)=>{ T.cum[i]=_acc; _acc+=T.weights[i]; }); T.total=_acc||1;
  ensureCtx(); syncSoundIcon();
  $('#timerScreen').classList.add('show'); document.body.style.overflow='hidden';
  requestWake(); applyPhase();
  clearInterval(T.interval); T.interval=setInterval(tick,120);
}
function tick(){
  if(!T.running) return;
  const p=T.phases[T.idx];
  if(!p || p.mode==='manual' || p.type==='done') return;
  const now=Date.now(); T.remaining-=(now-T.last)/1000; T.last=now;
  if(T.remaining<=0.05){ T.idx++; if(T.idx>=T.phases.length){ finishSession(); return; } T.remaining=T.phases[T.idx].sec||0; T.lastSec=null; applyPhase(); }
  else { const cur=Math.ceil(T.remaining); if(cur!==T.lastSec && cur>=1 && cur<=3){ countdownBeep(cur); } T.lastSec=cur; }
  updateNum();
}
function applyPhase(){
  const p=T.phases[T.idx], sc=$('#timerScreen'), btn=$('#playBtn');
  sc.className='timer-screen show phase-'+p.type;
  $('#tsBlock').textContent=p.exCat||'';
  $('#tsLabel').textContent=p.label||'';
  $('#tsMeta').textContent=p.info||'';
  let nx=null;
  for(let i=T.idx+1;i<T.phases.length;i++){ const q=T.phases[i]; if(q.type==='done')break; if(q.exName && q.exName!==p.exName){ nx=q.exName; break; } }
  $('#tsNext').textContent = p.type==='done' ? '' : (nx? 'Sigue: '+nx : '\u00daltimo ejercicio \ud83d\udcaa');
  T.curUrl = p.vurl||null;
  T.curVid = p.vid||null;
  $('#tsVideo').classList.toggle('hide', !(T.curUrl && p.type!=='done'));
  const _ext=document.getElementById('tsVideoExt'); if(_ext) _ext.textContent = ytId(T.curUrl)? '↗ Sin anuncios' : '↗ Abrir';
  updateNum();
  const vibMap={prep:[120],work:[260],rest:[90,60,90],restSeries:[90,60,90,60,90],reps:[200],done:[300,120,300,120,400]};
  vibrate(vibMap[p.type]||[120]);
  phaseBeep(p.type);
  if(p.type==='done'){ T.running=false; clearInterval(T.interval); btn.textContent = T.student? '\u2713 Avisar que termin\u00e9' : (T.program? '\u2713 Registrar asistencia' : 'Cerrar'); }
  else if(p.mode==='manual'){ btn.textContent='\u2713 Siguiente'; }
  else { btn.textContent = T.running?'Pausar':'Reanudar'; }
}
function updateNum(){
  const p=T.phases[T.idx];
  const ring=$('#tsRing'), ringO=$('#tsRingOuter');
  const setOuter=()=>{ if(!ringO||!T.cum) return;
    const w=T.weights[T.idx]||0;
    const ef = p.type==='done'?1 : (p.mode==='manual'?0 : (p.sec? (1-T.remaining/p.sec):0));
    const done=(T.cum[T.idx]||0)+w*ef;
    const tf=Math.max(0,Math.min(1, done/(T.total||1)));
    ringO.style.strokeDashoffset=100*(1-tf);
  };
  if(p.type==='done'){ $('#tsNum').textContent='\u2713'; if(ring)ring.style.strokeDashoffset=0; if(ringO)ringO.style.strokeDashoffset=0; return; }
  if(p.mode==='manual'){ $('#tsNum').textContent = p.reps? p.reps : '\u25b6'; if(ring)ring.style.strokeDashoffset=0; setOuter(); return; }
  const left=Math.max(0,Math.ceil(T.remaining));
  $('#tsNum').textContent = left>=60? Math.floor(left/60)+':'+String(left%60).padStart(2,'0') : left;
  const frac=p.sec? Math.max(0,Math.min(1, T.remaining/p.sec)) : 1;
  if(ring) ring.style.strokeDashoffset = 100*(1-frac);
  setOuter();
}
function toggleTimer(){
  const p=T.phases[T.idx]; if(!p) return;
  if(p.type==='done'){ if(T.student) studentNotifyDone(); else if(T.program) finishAttendance(); else exitTimer(); return; }
  if(p.mode==='manual'){ skipPhase(); return; }
  T.running=!T.running; T.last=Date.now();

}
function skipPhase(){ if(!T.phases.length)return; T.idx++; if(T.idx>=T.phases.length){ finishSession(); return; } T.remaining=T.phases[T.idx].sec||0; T.lastSec=null; T.running=true; T.last=Date.now(); applyPhase(); }
function resetTimer(){ if(!T.phases.length)return; T.idx=0; T.remaining=T.phases[0].sec||0; T.lastSec=null; T.running=true; T.last=Date.now(); applyPhase(); }
function finishSession(){ T.idx=T.phases.length-1; T.remaining=0; applyPhase(); }

function exitTimer(){ T.running=false; clearInterval(T.interval); releaseWake(); $('#timerScreen').classList.remove('show'); document.body.style.overflow=''; }
function syncSoundIcon(){ $('#soundIcon').innerHTML = T.beep
  ? '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/>'
  : '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/>'; }
function toggleBeep(){ T.beep=!T.beep; if(T.beep) ensureCtx(); syncSoundIcon(); toast(T.beep?'Sonido activado':'Sonido en silencio'); }
let actx;
function ensureCtx(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); if(actx && !actx._master){ actx._master=actx.createGain(); actx._master.gain.value=soundVol(); actx._master.connect(actx.destination); } }catch(e){} return actx; }
function tone(freq,dur,vol,type){
  if(!T.beep) return;
  const c=ensureCtx(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(c._master||c.destination);
    const t0=c.currentTime;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function countdownBeep(n){
  if(playCustom('cuenta')) return;
  tone(880,0.15,0.78,'square');
}
function phaseBeep(type){
  if((type==='work'||type==='reps') && playCustom('inicio')) return;
  if((type==='rest'||type==='restSeries') && playCustom('descanso')) return;
  if(type==='work'){ tone(990,0.20,0.5); setTimeout(()=>tone(990,0.20,0.5),150); }
  else if(type==='reps'){ tone(880,0.22,0.5); }
  else if(type==='rest'||type==='restSeries'){ tone(500,0.26,0.42); }
  else if(type==='done'){ celebrate(); }
  else { tone(620,0.16,0.36); }
}
/* ---- Celebración final: fanfarria + aplausos + voz ---- */
function brass(c,freq,t0,dur){
  try{
    const o=c.createOscillator(), g=c.createGain(), lp=c.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=freq;
    lp.type='lowpass'; lp.frequency.value=2800;
    o.connect(lp); lp.connect(g); g.connect(c._master||c.destination);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.34,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function applause(c,t0,dur){
  try{
    const sr=c.sampleRate, len=Math.floor(sr*dur), buf=c.createBuffer(1,len,sr), data=buf.getChannelData(0);
    let amp=0.4;
    for(let i=0;i<len;i++){ amp+=(Math.random()-0.5)*0.4; if(amp<0.1)amp=0.1; if(amp>1)amp=1; data[i]=(Math.random()*2-1)*amp; }
    const src=c.createBufferSource(); src.buffer=buf;
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=0.5;
    const g=c.createGain();
    src.connect(bp); bp.connect(g); g.connect(c._master||c.destination);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(0.30,t0+0.2);
    g.gain.setValueAtTime(0.30,t0+dur-0.5);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.start(t0); src.stop(t0+dur);
  }catch(e){}
}
function say(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='es-MX'; u.rate=1; u.pitch=1.15; u.volume=1;
    const v=speechSynthesis.getVoices().find(x=>/es(-|_)?(MX|ES|US|419)?/i.test(x.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function celebrate(){
  if(!T.beep) return;
  if(playCustom('final')){ vibrate([300,120,300,120,500]); return; }
  const c=ensureCtx(); if(!c) return;
  const t=c.currentTime;
  applause(c, t+0.05, 2.2);
  [[523,0],[659,0.14],[784,0.28],[1046,0.46]].forEach(([f,d],i)=> brass(c,f,t+0.1+d, i===3?0.8:0.14));
  const phrases=['¡Bien hecho!','¡Excelente trabajo!','¡Lo lograste, campeón!','¡Eso es, muy bien!','¡Buen esfuerzo, crack!'];
  setTimeout(()=>say(phrases[Math.floor(Math.random()*phrases.length)]), 750);
  vibrate([300,120,300,120,500]);
}

function releaseWake(){ try{ T.wake&&T.wake.release(); T.wake=null; }catch(e){} }

function calNav(d){ let m=calRef.m+d, y=calRef.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} calRef={y,m}; render(); }

let _pendingImport=null;
function importPick(inp){
  const f=inp.files&&inp.files[0]; if(!f){ return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data||typeof data!=='object'||(!Array.isArray(data.students)&&!Array.isArray(data.payments))){ toast('Ese archivo no es una copia válida'); return; }
      _pendingImport=data; askImportMode(data);
    }catch(e){ toast('No se pudo leer el archivo'); }
  };
  r.onerror=()=>toast('No se pudo leer el archivo');
  r.readAsText(f); inp.value='';
}
function askImportMode(d){
  const n=a=>Array.isArray(a)?a.length:0;
  openModal(`<h2>Importar copia</h2>
    <div class="card"><div class="tiny muted" style="line-height:1.8">El archivo contiene:<br>
      • ${n(d.students)} alumnos<br>
      • ${n(d.payments)} pagos · ${n(d.attendance)} asistencias<br>
      • ${n(d.programs)} programas · ${n(d.exercises)} ejercicios<br>
      • ${n(d.tabatas)} tabatas guardadas</div></div>
    <div class="tiny muted" style="margin:8px 2px 12px">¿Cómo quieres importarlos?</div>
    <button class="btn primary" onclick="applyImport('replace')">Reemplazar todo (restaurar)</button>
    <div style="height:8px"></div>
    <button class="btn ghost" onclick="applyImport('merge')">Combinar (agregar lo que no exista)</button>
    <div style="height:8px"></div>
    <button class="btn ghost" onclick="closeModal(); _pendingImport=null;">Cancelar</button>`);
}
function applyImport(mode){
  const d=_pendingImport; if(!d){ closeModal(); return; }
  if(mode==='replace'){
    if(!confirm('Esto reemplazará TODOS tus datos actuales por los de la copia. ¿Seguro?')) return;
    db=d;
  } else {
    const mergeArr=key=>{ if(!Array.isArray(d[key]))return; if(!Array.isArray(db[key]))db[key]=[]; const ids=new Set(db[key].map(x=>x&&x.id)); d[key].forEach(it=>{ if(it&&it.id!=null){ if(!ids.has(it.id)){ db[key].push(it); ids.add(it.id);} } else { db[key].push(it); } }); };
    ['students','programs','exercises','attendance','payments','plans','tabatas'].forEach(mergeArr);
    const mergeUniq=key=>{ if(!Array.isArray(d[key]))return; if(!Array.isArray(db[key]))db[key]=[]; d[key].forEach(v=>{ if(!db[key].includes(v))db[key].push(v); }); };
    mergeUniq('categories'); mergeUniq('seededKeys');
  }
  db.students=db.students||[]; db.programs=db.programs||[]; db.exercises=db.exercises||[];
  db.attendance=db.attendance||[]; db.payments=db.payments||[]; db.plans=db.plans||[]; db.tabatas=db.tabatas||[];
  db.categories=db.categories||[]; db.seededKeys=db.seededKeys||[];
  if(!db.settings) db.settings={pkgPrice:300,pkgSize:6,particularPrice:150};
  if(db.settings.soundVol==null) db.settings.soundVol=0.9;
  if(!db.settings.sounds) db.settings.sounds={};
  _pendingImport=null;
  save(); closeModal(); go('alumnos'); toast(mode==='replace'?'Datos restaurados':'Datos combinados');
}
function resetData(){ if(!confirm('Esto borra TODOS los datos. ¿Seguro?'))return; if(!confirm('Última confirmación: se perderá todo.'))return; db=loadDB.call(null); db={students:[],programs:[],attendance:[],payments:[],settings:{pkgPrice:300,pkgSize:6,particularPrice:150}}; save(); closeModal(); go('alumnos'); toast('Datos borrados'); }

let STUDENT=false, STUDENT_PROFILE=null;
function hasCoachData(){
  let raw=null;
  try{ raw=Store.get(KEY); }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(!raw) return false;
  try{ const d=JSON.parse(raw); return !!(d&&((d.students&&d.students.length)||(d.programs&&d.programs.length))); }catch(e){ return false; }
}
function decodeStudentPayload(s){ try{ const j=LZString.decompressFromEncodedURIComponent(s); return j? JSON.parse(j):null; }catch(e){ return null; } }
function detectStudent(){
  const m=location.hash.match(/[#&]a=([^&]+)/);
  if(m){
    const prof=decodeStudentPayload(m[1]);
    if(prof && prof.p){ STUDENT_PROFILE=prof; if(!hasCoachData()){ try{ localStorage.setItem('dynastia_alumno', JSON.stringify(prof)); }catch(e){} } return true; }
  }
  if(!hasCoachData()){
    try{ const saved=localStorage.getItem('dynastia_alumno'); if(saved){ STUDENT_PROFILE=JSON.parse(saved); return true; } }catch(e){}
  }
  return false;
}
function startStudent(){
  STUDENT=true; document.body.classList.add('student');
  const sub=document.querySelector('.topbar .sub');
  if(sub){ const coach=esc(STUDENT_PROFILE.c||'Gustavo Díaz'); sub.innerHTML = coach+' · Coach de bateo<br><span style="text-transform:none;letter-spacing:.02em;opacity:.9;font-weight:600">'+esc(STUDENT_PROFILE.n||'Alumno')+'</span>'; }
  renderStudent(); checkAccess();
}
function accessState(){
  const p=STUDENT_PROFILE; if(!p) return {ok:false,reason:'no'};
  if(p._blocked) return {ok:false,reason:'cut'};
  const exp=p._expEff||p.x;
  if(exp && todayISO()>exp) return {ok:false,reason:'exp'};
  return {ok:true};
}
function renderStudent(){
  const p=STUDENT_PROFILE, st=accessState();
  let h=`<section class="view">`;
  if(!st.ok){
    const msg = st.reason==='cut' ? 'Tu acceso fue desactivado.' : 'Tu acceso venció.';
    h+=`<div class="card lock-card"><div class="em">🔒</div><h2 style="margin:0 0 6px">Acceso terminado</h2>
      <div class="muted" style="margin-bottom:16px">${msg} Renueva con tu coach para seguir entrenando.</div>
      <button class="btn primary" onclick="studentContact()" style="width:auto">Escribir al coach</button></div>`;
  } else {
    h+=`<h1 class="view-title bebas">Hola, ${esc(p.n||'')}</h1><div class="view-sub">Acceso hasta ${(p._expEff||p.x)?fmtDate(p._expEff||p.x):'—'}</div>`;
    h+=`<div class="card" style="line-height:1.7;margin-bottom:6px"><b>Tus entrenamientos</b><br><span class="muted">${esc(p.c||'Gustavo Díaz')} · Tu coach personal de bateo te asignó estos programas. Toca uno para ver los ejercicios (con su explicación y video) y empezar cuando quieras. La app te irá guiando con cuenta regresiva, colores y sonido.</span></div>`;
    h+=`<div class="section-h">Tus programas</div>`;
    (p.p||[]).forEach((pr,i)=>{
      const tot=(pr.it||[]).reduce((a,it)=>a+itemTimedSeconds(it),0);
      h+=`<div class="card row between stu-prog" onclick="openStudentProgram(${i})"><div style="flex:1;min-width:0"><b>${esc(pr.n||('Programa '+(i+1)))}</b><div class="tiny muted">${(pr.it||[]).length} ejercicios · ~${fmtDur(tot)}</div></div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>`;
    });
    if(!(p.p&&p.p.length)) h+=`<div class="card muted">Tu coach aún no te asignó programas.</div>`;
  }
  h+=`</section>`;
  main.innerHTML=h;
}
function checkAccess(){
  const p=STUDENT_PROFILE; if(!p||!p.k) return;
  const base=location.href.split('#')[0].replace(/[^/]*$/,'');
  fetch(base+'alumnos.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{
    if(!data||!data.codes) return;
    const e=data.codes[p.k];
    if(e===undefined) return;
    if(e.active===false){ p._blocked=true; } else { p._blocked=false; if(e.exp) p._expEff=e.exp; }
    try{ localStorage.setItem('dynastia_alumno', JSON.stringify(p)); }catch(_){}
    if(STUDENT) renderStudent();
  }).catch(()=>{});
}
function openStudentProgram(i){ renderStudentProgram(i); window.scrollTo(0,0); }
function renderStudentProgram(i){
  const pr=(STUDENT_PROFILE.p||[])[i]; if(!pr){ renderStudent(); return; }

    <div class="section-h">Ejercicios</div>`;
  its.forEach((it,idx)=>{
    const param = it.type==='reps' ? `${it.series||1} series × ${it.reps||0} reps` : `${it.work||0}s × ${it.rounds||1} rondas${(+it.series||1)>1?(' · '+it.series+' series'):''}`;
    h+=`<div class="card"><b>${idx+1}. ${esc(it.name||'')}</b><div class="tiny muted" style="margin-top:2px">${esc(it.category||'')} · ${param}</div>`;
    if(it.note) h+=`<div class="tiny" style="margin-top:8px;line-height:1.6">${esc(it.note)}</div>`;
    h+= demoBtn(it.video||'');

  });
  h+=`<button class="btn primary" style="margin-top:8px" onclick="startStudentProgram(${i})"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M5 4l14 8-14 8z"/></svg>Comenzar entrenamiento</button></section>`;
  main.innerHTML=h;
}
function startStudentProgram(i){
  const pr=(STUDENT_PROFILE.p||[])[i]; if(!pr) return;
  let steps=[]; (pr.it||[]).forEach(it=> steps=steps.concat(buildExerciseSteps(it)));
  if(!steps.length){ toast('Programa sin tiempos'); return; }
  steps.unshift({mode:'auto',type:'prep',exName:'',exCat:'',label:'Prepárate',info:(pr.n||'Tu entrenamiento'),sec:10,vurl:''});

  T.student=true; T.studentProg=pr.n||'';
}

=================================================================== */
let _reportBlob=null,_reportName='';
function rpChk(v,label){ return `<label class="li" style="cursor:pointer"><input type="checkbox" class="rpc" value="${v}" checked style="width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto"><div class="meta"><div class="nm">${label}</div></div></label>`; }
function openReport(id){
  const st=db.students.find(x=>x.id===id); if(!st) return;
  const to=todayISO(), from=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  openModal(`<h2>Reporte de avance</h2>
    <div class="tiny muted" style="margin-bottom:10px">Genera una imagen con el avance de ${esc(st.name)} para compartir por WhatsApp.</div>
    <div class="grid2">
      <label class="field" style="margin:0"><span class="lab">Desde</span><input class="input" id="rp_from" type="date" value="${from}"></label>
      <label class="field" style="margin:0"><span class="lab">Hasta</span><input class="input" id="rp_to" type="date" value="${to}"></label>
    </div>
    <div class="section-h">Incluir en el reporte</div>
    <div class="card pad0">
      ${rpChk('clases','Clases asistidas y paquete')}
      ${rpChk('chart','Gráfica de asistencia por mes')}
      ${rpChk('programas','Programas entrenados')}
      ${rpChk('pagos','Pagos / estado de cuenta')}
      ${rpChk('nota','Nota del coach')}
    </div>
    <label class="field" style="margin-top:12px"><span class="lab">Nota del coach (opcional)</span><textarea class="input" id="rp_note" placeholder="Ej. ¡Gran avance, Carlos! Sigue trabajando el swing..."></textarea></label>
    <button class="btn primary" onclick="generateReport('${id}')" style="margin-top:6px">Generar imagen</button>`);
}
async function generateReport(id){
  const st=db.students.find(x=>x.id===id); if(!st) return;
  const from=document.getElementById('rp_from').value||'0001-01-01', to=document.getElementById('rp_to').value||todayISO();
  const inR=x=> x>=from && x<=to;
  const sel=new Set([...document.querySelectorAll('.rpc:checked')].map(c=>c.value));
  const note=(document.getElementById('rp_note').value||'').trim();
  const att=db.attendance.filter(a=>a.studentId===id && inR(a.date));
  const pays=db.payments.filter(p=>p.studentId===id && inR(p.date)).sort((a,b)=>b.date.localeCompare(a.date));
  toast('Generando imagen...');
  try{
    const cv=await drawReportCanvas({st,from,to,sel,note,att,pays});
    cv.toBlob(function(blob){ if(!blob){ toast('No se pudo generar'); return; } showReportPreview(blob, st.name); }, 'image/png');
  }catch(e){ toast('No se pudo generar la imagen'); }
}
function F(s,w){ return w+' '+s+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'; }
function roundRectC(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function loadImg(src){ return new Promise(res=>{ if(!src){res(null);return;} const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
function emblemSrc(){ try{ const el=document.querySelector('.logo'); const bg=el?getComputedStyle(el).backgroundImage:''; const m=bg&&bg.match(/url\(["']?(data:[^"')]+)["']?\)/); return m?m[1]:null; }catch(e){ return null; } }
function _initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }
function truncTxt(ctx,t,maxW){ if(ctx.measureText(t).width<=maxW) return t; let s=t; while(s.length && ctx.measureText(s+'…').width>maxW) s=s.slice(0,-1); return s+'…'; }
function wrapLines(ctx,text,maxW){ const out=[]; (text||'').split('\n').forEach(para=>{ const words=para.split(' '); let line=''; words.forEach(wd=>{ const t=line?line+' '+wd:wd; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=wd; } else line=t; }); out.push(line); }); return out; }
function monthSeq(from,to){ let fm=from.slice(0,7), tm=to.slice(0,7); if(fm<'1900-01') fm=tm; const res=[]; let a=fm.split('-').map(Number), b=tm.split('-').map(Number); let y=a[0],m=a[1]; let g=0; while((y<b[0]||(y===b[0]&&m<=b[1])) && g++<60){ res.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} } return res.length>12? res.slice(res.length-12): res; }
function monthLabel(m){ const p=m.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('es-MX',{month:'short'}); }
function drawAvatar(ctx,x,y,s,img,name){ ctx.save(); ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s/2,0,7); ctx.closePath(); ctx.clip(); if(img){ const r=Math.max(s/img.width,s/img.height); const iw=img.width*r, ih=img.height*r; ctx.drawImage(img,x+(s-iw)/2,y+(s-ih)/2,iw,ih); } else { ctx.fillStyle='#1f6dff'; ctx.fillRect(x,y,s,s); ctx.fillStyle='#fff'; ctx.font=F(s*0.4,800); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(_initials(name),x+s/2,y+s/2); ctx.textAlign='left'; ctx.textBaseline='alphabetic'; } ctx.restore(); ctx.strokeStyle='rgba(86,160,255,.6)'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s/2,0,7); ctx.stroke(); ctx.lineWidth=1; }
function drawSecH(ctx,title,x,y,W,P){ ctx.fillStyle='#56a0ff'; ctx.font=F(22,700); ctx.fillText(title.toUpperCase(),x,y+8); ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(x,y+24); ctx.lineTo(W-P,y+24); ctx.stroke(); return y+58; }
async function drawReportCanvas(d){
  const W=1080, P=56, contentW=W-P*2;
  const emblem=await loadImg(emblemSrc());
  const photo=await loadImg(d.st.photo);
  const tmp=document.createElement('canvas').getContext('2d');
  const pc={}; d.att.forEach(a=>{const k=a.program||'Sesión libre'; if(!pc[k])pc[k]={n:0,last:a.date}; pc[k].n++; if(a.date>pc[k].last)pc[k].last=a.date;});
  const progKeys=Object.keys(pc).sort((a,b)=>pc[b].n-pc[a].n);
  const totalPay=d.pays.reduce((a,p)=>a+p.amount,0);
  let noteLines=[]; if(d.sel.has('nota') && d.note){ tmp.font=F(24,500); noteLines=wrapLines(tmp,d.note,contentW-40); }
  const months=d.sel.has('chart')? monthSeq(d.from,d.to): [];
  let H=P+210+210+20;
  if(d.sel.has('clases')) H+=58+170;
  if(d.sel.has('chart')) H+=58+300;
  if(d.sel.has('programas')) H+=58+ (progKeys.length? Math.min(progKeys.length,8)*66+26 : 60);
  if(d.sel.has('pagos')) H+=58+80+Math.min(d.pays.length,6)*58+50;
  if(d.sel.has('nota') && d.note) H+=58+noteLines.length*40+50;
  H+=110; H=Math.round(H);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#151b24'); g.addColorStop(1,'#0a0d12'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  let y=P;
  if(emblem){ const es=120; ctx.drawImage(emblem,P,y,es,es*emblem.height/emblem.width); }
  ctx.fillStyle='#eef2f7'; ctx.font=F(52,800); ctx.fillText('DYNASTIA', P+142, y+52);
  ctx.fillStyle='#8a98a8'; ctx.font=F(25,600); ctx.fillText('Reporte de avance', P+144, y+88);
  ctx.fillStyle='#56a0ff'; ctx.font=F(23,600); ctx.fillText('Gustavo Díaz · Coach de bateo', P+144, y+122);
  y+=210;
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(W-P,y); ctx.stroke(); y+=34;
  const ps=150; drawAvatar(ctx,P,y,ps,photo,d.st.name);
  ctx.fillStyle='#fff'; ctx.font=F(46,800); ctx.fillText(truncTxt(ctx,d.st.name,contentW-ps-30), P+ps+30, y+52);
  ctx.fillStyle='#8a98a8'; ctx.font=F(25,500); ctx.fillText('Periodo: '+fmtDate(d.from)+'  –  '+fmtDate(d.to), P+ps+30, y+92);
  ctx.fillText('Generado: '+fmtDate(todayISO()), P+ps+30, y+128);
  y+=210-34;
  if(d.sel.has('clases')){
    y=drawSecH(ctx,'Resumen',P,y,W,P);
    const size=d.st.package&&d.st.package.size?d.st.package.size:0, used=d.st.package&&d.st.package.used?d.st.package.used:0, rem=size?Math.max(0,size-used):0;
    const tiles=[['Clases en el periodo',String(d.att.length)],['Total histórico',String(db.attendance.filter(a=>a.studentId===d.st.id).length)],[size?'Paquete restante':'Modalidad', size?(rem+' de '+size):'Particular']];
    const tw=(contentW-48)/3;
    tiles.forEach((t,i)=>{ const tx=P+i*(tw+24); roundRectC(ctx,tx,y,tw,120,16); ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fill(); ctx.fillStyle='#fff'; ctx.font=F(40,800); ctx.fillText(truncTxt(ctx,t[1],tw-40),tx+22,y+64); ctx.fillStyle='#8a98a8'; ctx.font=F(19,600); ctx.fillText(t[0],tx+22,y+98); });
    y+=120+40;
  }
  if(d.sel.has('chart')){
    y=drawSecH(ctx,'Asistencia por mes',P,y,W,P);
    const byM={}; d.att.forEach(a=>{const m=a.date.slice(0,7); byM[m]=(byM[m]||0)+1;});
    const counts=months.map(m=>byM[m]||0), maxC=Math.max(1,...counts);
    const chartH=180, baseY=y+chartH, chartX=P+6, chartW=contentW-12, n=months.length||1, slot=chartW/n, bw=Math.min(66,slot*0.6);
    ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(P,baseY); ctx.lineTo(W-P,baseY); ctx.stroke();
    months.forEach((m,i)=>{ const val=counts[i], bh=maxC?(val/maxC)*(chartH-10):0, bx=chartX+i*slot+(slot-bw)/2, by=baseY-bh;
      const gr=ctx.createLinearGradient(0,by,0,baseY); gr.addColorStop(0,'#56a0ff'); gr.addColorStop(1,'#1f6dff'); roundRectC(ctx,bx,by,bw,Math.max(bh,2),8); ctx.fillStyle=gr; ctx.fill();
      if(val){ ctx.fillStyle='#eef2f7'; ctx.font=F(22,700); ctx.textAlign='center'; ctx.fillText(String(val),bx+bw/2,by-10); }
      ctx.fillStyle='#8a98a8'; ctx.font=F(18,600); ctx.textAlign='center'; ctx.fillText(monthLabel(m),bx+bw/2,baseY+32); ctx.textAlign='left';
    });
    y=baseY+62;
  }
  if(d.sel.has('programas')){
    y=drawSecH(ctx,'Programas entrenados',P,y,W,P);
    if(!progKeys.length){ ctx.fillStyle='#8a98a8'; ctx.font=F(23,500); ctx.fillText('Aún no ha entrenado programas.',P,y+12); y+=54; }
    else { progKeys.slice(0,8).forEach(k=>{ roundRectC(ctx,P,y,contentW,54,12); ctx.fillStyle='rgba(255,255,255,.04)'; ctx.fill();
        ctx.fillStyle='#eef2f7'; ctx.font=F(25,700); ctx.textAlign='left'; ctx.fillText(truncTxt(ctx,k,contentW-320),P+20,y+35);
        ctx.fillStyle='#8a98a8'; ctx.font=F(19,500); ctx.textAlign='right'; ctx.fillText('Última: '+fmtDate(pc[k].last),W-P-92,y+34);
        ctx.fillStyle='#1f6dff'; roundRectC(ctx,W-P-78,y+13,60,28,14); ctx.fill(); ctx.fillStyle='#fff'; ctx.font=F(20,800); ctx.textAlign='center'; ctx.fillText(pc[k].n+'×',W-P-48,y+33); ctx.textAlign='left';
        y+=66; }); y+=10; }
  }
  if(d.sel.has('pagos')){
    y=drawSecH(ctx,'Pagos / estado de cuenta',P,y,W,P);
    roundRectC(ctx,P,y,contentW,60,12); ctx.fillStyle='rgba(61,220,132,.10)'; ctx.fill();
    ctx.fillStyle='#eef2f7'; ctx.font=F(25,700); ctx.textAlign='left'; ctx.fillText('Total pagado en el periodo',P+20,y+38);
    ctx.fillStyle='#3ddc84'; ctx.font=F(28,800); ctx.textAlign='right'; ctx.fillText(peso(totalPay),W-P-20,y+38); ctx.textAlign='left'; y+=76;
    d.pays.slice(0,6).forEach(p=>{ ctx.fillStyle='#cfd6de'; ctx.font=F(22,600); ctx.textAlign='left'; ctx.fillText(truncTxt(ctx,p.concept,contentW-260)+'  ·  '+fmtDate(p.date),P+6,y+28);
      ctx.fillStyle='#3ddc84'; ctx.font=F(22,700); ctx.textAlign='right'; ctx.fillText(peso(p.amount),W-P-6,y+28); ctx.textAlign='left'; y+=52; });
    if(d.pays.length>6){ ctx.fillStyle='#8a98a8'; ctx.font=F(19,500); ctx.fillText('+ '+(d.pays.length-6)+' pagos más',P+6,y+22); y+=38; }
    y+=10;
  }
  if(d.sel.has('nota') && d.note){
    y=drawSecH(ctx,'Nota del coach',P,y,W,P);
    roundRectC(ctx,P,y,contentW,noteLines.length*40+28,12); ctx.fillStyle='rgba(31,109,255,.10)'; ctx.fill();
    ctx.fillStyle='#eef2f7'; ctx.font=F(24,500); ctx.textAlign='left';
    noteLines.forEach((ln,i)=>{ ctx.fillText(ln,P+20,y+36+i*40); });
    y+=noteLines.length*40+28+22;
  }
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(P,H-78); ctx.lineTo(W-P,H-78); ctx.stroke();
  ctx.fillStyle='#8a98a8'; ctx.font=F(20,500); ctx.textAlign='left'; ctx.fillText('Generado con DYNASTIA · Gustavo Díaz · Coach de bateo',P,H-42);
  return cv;
}
function showReportPreview(blob,name){
  _reportBlob=blob; _reportName=name||'alumno';
  const url=URL.createObjectURL(blob);
  openModal(`<h2>Reporte listo</h2>
    <img src="${url}" style="width:100%;border-radius:14px;border:1px solid var(--line);margin-bottom:12px" alt="Reporte">
    <button class="btn primary" onclick="shareReportImage()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="2" style="margin-right:6px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>Compartir imagen</button>
    <button class="btn ghost" style="margin-top:8px" onclick="downloadReportImage()">Descargar</button>`);
}
async function shareReportImage(){
  if(!_reportBlob) return;
  const file=new File([_reportBlob], 'reporte-'+_reportName.replace(/\s+/g,'_')+'.png', {type:'image/png'});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Reporte de avance', text:'Reporte de avance · DYNASTIA'}); return; } }catch(e){ return; }
  downloadReportImage();
}
function downloadReportImage(){ if(!_reportBlob) return; const a=document.createElement('a'); a.href=URL.createObjectURL(_reportBlob); a.download='reporte-'+_reportName.replace(/\s+/g,'_')+'.png'; a.click(); }

/* ---------------- init ---------------- */
async function requestPersistence(){
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      if(!already) await navigator.storage.persist();
    }
  }catch(e){}
}
requestPersistence();
if(detectStudent()){ startStudent(); } else { render(); }

(function(){var s=document.getElementById('splash'); if(s){ setTimeout(function(){ s.classList.add('hide'); setTimeout(function(){ if(s&&s.parentNode) s.parentNode.removeChild(s); },650); }, 1700);} })();
</script>
</body>
